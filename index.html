<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Gestor Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useState, useEffect, useReducer, createContext, useContext } =
        React;
      const initialState = {
        transactions: JSON.parse(sessionStorage.getItem("transactions")) || [],
      };
      const AppReducer = (state, action) => {
        switch (action.type) {
          case "ADD_TRANSACTION":
            return {
              ...state,
              transactions: [action.payload, ...state.transactions],
            };
          case "DELETE_TRANSACTION":
            return {
              ...state,
              transactions: state.transactions.filter(
                (t) => t.id !== action.payload
              ),
            };
          default:
            return state;
        }
      };
      const GlobalContext = createContext(initialState);
      const GlobalProvider = ({ children }) => {
        const [state, dispatch] = useReducer(AppReducer, initialState);
        useEffect(() => {
          localStorage.setItem(
            "transactions",
            JSON.stringify(state.transactions)
          );
        }, [state.transactions]);

        function addTransaction(transaction) {
          dispatch({
            type: "ADD_TRANSACTION",
            payload: transaction,
          });
        }

        function deleteTransaction(id) {
          dispatch({
            type: "DELETE_TRANSACTION",
            payload: id,
          });
        }

        return (
          <GlobalContext.Provider
            value={{
              transactions: state.transactions,
              addTransaction,
              deleteTransaction,
            }}
          >
            {children}
          </GlobalContext.Provider>
        );
      };

      const Balance = () => {
        const { transactions } = useContext(GlobalContext);

        const amounts = transactions.map((t) => t.amount);
        const total = amounts
          .reduce((acc, item) => (acc += item), 0)
          .toFixed(2);
        const income = amounts
          .filter((item) => item > 0)
          .reduce((acc, item) => (acc += item), 0)
          .toFixed(2);
        const expense = (
          amounts
            .filter((item) => item < 0)
            .reduce((acc, item) => (acc += item), 0) * -1
        ).toFixed(2);

        return (
          <div>
            <div>
              <h4>Seu Saldo</h4>
              <h1>R$ {total}</h1>
            </div>
            <div className="flex justify-around border p-2 my-2">
              <div>
                <h3>Receitas</h3>
                <p>R$ {income}</p>
              </div>
              <div>
                <h3>Despesas</h3>
                <p>R$ {expense}</p>
              </div>
            </div>
          </div>
        );
      };

      const TransactionList = () => {
        const { transactions, deleteTransaction } = useContext(GlobalContext);

        if (transactions.length === 0) {
          return (
            <div>
              <p>Nenhuma transação adicionada ainda.</p>
            </div>
          );
        }

        return (
          <div className="my-4">
            <h3>Histórico</h3>
            <ul className="p-0">
              {transactions.map((transaction) => {
                const sign = transaction.amount < 0 ? "-" : "+";
                const itemStyle = {
                  borderRight: `4px solid ${
                    transaction.amount < 0 ? "red" : "green"
                  }`,
                };
                return (
                  <li
                    key={transaction.id}
                    style={itemStyle}
                    className="flex justify-between items-center border bg-gray-50 p-2 my-1"
                  >
                    <span>{transaction.text}</span>
                    <div>
                      <span>
                        {sign}R$ {Math.abs(transaction.amount).toFixed(2)}
                      </span>
                      <button
                        onClick={() => deleteTransaction(transaction.id)}
                        className="ml-4 text-red-600"
                      >
                        X
                      </button>
                    </div>
                  </li>
                );
              })}
            </ul>
          </div>
        );
      };

      const DashboardPage = ({ setPage }) => (
        <div className="p-4">
          <Balance />
          <TransactionList />
          <button
            onClick={() => setPage("add")}
            className="p-2 border bg-blue-500 text-white"
          >
            + Nova Transação
          </button>
        </div>
      );

      const AddTransactionPage = ({ setPage }) => {
        const [text, setText] = useState("");
        const [amount, setAmount] = useState("");
        const [type, setType] = useState("expense");
        const [error, setError] = useState("");

        const { addTransaction } = useContext(GlobalContext);

        const onSubmit = (e) => {
          e.preventDefault();
          if (text.trim() === "" || amount.trim() === "") {
            setError("Por favor, preencha a descrição e o valor.");
            return;
          }

          const finalAmount =
            type === "expense"
              ? -Math.abs(parseFloat(amount))
              : Math.abs(parseFloat(amount));

          const newTransaction = {
            id: Math.floor(Math.random() * 100000000),
            text,
            amount: finalAmount,
          };

          addTransaction(newTransaction);
          setPage("dashboard");
        };

        return (
          <div className="p-4">
            <button onClick={() => setPage("dashboard")}>&larr; Voltar</button>
            <h3>Nova Transação</h3>

            <form onSubmit={onSubmit} className="my-4">
              {error && <p style={{ color: "red" }}>{error}</p>}

              <div className="my-2">
                <label htmlFor="text">Descrição</label>
                <br />
                <input
                  type="text"
                  id="text"
                  value={text}
                  onChange={(e) => setText(e.target.value)}
                  placeholder="Ex: Salário, Aluguel..."
                  className="border p-1 w-full"
                />
              </div>

              <div className="my-2">
                <label htmlFor="amount">Valor</label>
                <br />
                <input
                  type="number"
                  id="amount"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  placeholder="0.00"
                  step="0.01"
                  className="border p-1 w-full"
                />
              </div>

              <div className="my-2">
                <label>
                  <input
                    type="radio"
                    name="type"
                    checked={type === "income"}
                    onChange={() => setType("income")}
                  />{" "}
                  Receita
                </label>
                <label className="ml-4">
                  <input
                    type="radio"
                    name="type"
                    checked={type === "expense"}
                    onChange={() => setType("expense")}
                  />{" "}
                  Despesa
                </label>
              </div>

              <button
                type="submit"
                className="p-2 border bg-blue-500 text-white mt-2"
              >
                Adicionar Transação
              </button>
            </form>
          </div>
        );
      };

      const App = () => {
        const [page, setPage] = useState("dashboard");

        useEffect(() => {
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
              navigator.serviceWorker
                .register("./sw.js")
                .then((reg) =>
                  console.log("Service worker registrado com sucesso:", reg)
                )
                .catch((err) =>
                  console.log("Erro ao registrar service worker:", err)
                );
            });
          }
        }, []);

        return (
          <GlobalProvider>
            <div>
              <header className="border-b p-2">
                <nav className="flex justify-between">
                  <h1>Gestor Financeiro</h1>
                  <div>
                    <button
                      onClick={() => setPage("dashboard")}
                      className="mr-2"
                    >
                      Dashboard
                    </button>
                    <button onClick={() => setPage("add")}>Adicionar</button>
                  </div>
                </nav>
              </header>
              <main>
                {page === "dashboard" ? (
                  <DashboardPage setPage={setPage} />
                ) : (
                  <AddTransactionPage setPage={setPage} />
                )}
              </main>
            </div>
          </GlobalProvider>
        );
      };

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
